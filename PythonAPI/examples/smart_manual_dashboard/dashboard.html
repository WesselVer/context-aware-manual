<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Manual · Dashboard</title>
<!--
  Screen 2 of the context-aware manual study: the dashboard from the
  "CARLA Test Dashboard" design, drawn at 1920x1080 and scaled to fit.

  The page renders whatever state the driver script streams from /events
  (server-sent events, one JSON object per message). Keys missing from a
  message keep their value from DEFAULTS below, so the script only has to
  send what it measures. Today that is the speed, gear, drive mode, regen
  level, throttle, brake and cruise control; the adaptive-cruise, autopilot
  and tip panels follow the same props as the design and are ready to be fed.

  ACC and autopilot coming on and going off each have their own chime.

  The context-aware manual (tips.py) is off until the driver script sends a
  level; the header's level selector then lights up and pulses, and the tip
  panel says what the manual is waiting for (contextStatus, tipProgress).

  A tip (showTip + tip) slides in with a chime, outlines the zones it names
  in tip.highlight, and draws either tip.control, the G25 shifter button to
  tap or hold, or tip.gesture, the movement the driver makes. Once the driver
  has done it, tip.complete shows it done, with a chime of its own.
  Zones: speed, throttle, brake, gear, cruise, acc, autopilot, driveMode, regen.
  Buttons: cc-onoff, cc-minus, cc-plus, cc-resume, autopilot, gap-minus, gap-plus.
  Gestures: release-throttle, press-brake.
-->
<style>
@font-face { font-family: 'Barlow'; font-weight: 400; src: url(fonts/Barlow-Regular.woff2) format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 600; src: url(fonts/Barlow-SemiBold.woff2) format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 700; src: url(fonts/Barlow-Bold.woff2) format('woff2'); }
@font-face { font-family: 'Barlow Semi Condensed'; font-weight: 600; src: url(fonts/BarlowSemiCondensed-SemiBold.woff2) format('woff2'); }
@font-face { font-family: 'Barlow Semi Condensed'; font-weight: 700; src: url(fonts/BarlowSemiCondensed-Bold.woff2) format('woff2'); }

html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0E13; cursor: none; }
button { font: inherit; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
#frame { width: 1920px; height: 1080px; box-sizing: border-box; padding: 36px 48px; display: flex; flex-direction: column; gap: 24px; background: #0B0E13; color: #E8EAED; font-family: 'Barlow', system-ui, sans-serif; --accent: #4DA3FF; }
#top, #tipslot { display: contents; }
/* A zone a tip refers to. The page is redrawn every frame, so the pulse is
   kept in step by a negative animation-delay from when the tip appeared. */
.zone-on { position: relative; border-radius: 16px; outline: 3px solid var(--accent); outline-offset: 12px; animation: zonePulse 2.4s ease-in-out infinite; }
@keyframes zonePulse {
  0%, 100% { outline-color: var(--accent); box-shadow: 0 0 34px 14px rgba(77, 163, 255, 0.22); }
  50% { outline-color: rgba(77, 163, 255, 0.45); box-shadow: 0 0 18px 6px rgba(77, 163, 255, 0.08); }
}
/* On the outline's top-right corner, where the zones have room above them. */
.zone-tag { position: absolute; top: -24px; right: -14px; padding: 2px 10px; border-radius: 6px; font: 700 13px 'Barlow', sans-serif; letter-spacing: 0.08em; background: var(--accent); color: #0B0E13; }
/* The tip's arrival: slides up, its border flashes and settles. */
.tip-in { animation: tipSlide 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), tipGlow 2.6s ease-out; }
@keyframes tipSlide { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes tipGlow {
  0%, 25% { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(77, 163, 255, 0.35), 0 0 60px 10px rgba(77, 163, 255, 0.30); }
  100% { border-color: #2B3A52; box-shadow: none; }
}
/* release-throttle: the foot lifts off the accelerator and the pedal springs up. */
.g-loop { animation: gFade 3.4s ease-in-out infinite; }
.g-foot { transform-box: view-box; transform-origin: 84px 168px; animation: gFoot 3.4s ease-in-out infinite; }
.g-pedal { transform-box: view-box; transform-origin: 210px 168px; animation: gPedal 3.4s ease-in-out infinite; }
.g-arrow { animation: gArrow 3.4s ease-in-out infinite; }
@keyframes gFade { 0% { opacity: 0; } 8%, 86% { opacity: 1; } 100% { opacity: 0; } }
@keyframes gFoot { 0%, 22% { transform: rotate(0deg); } 52%, 100% { transform: rotate(-13deg); } }
@keyframes gPedal { 0%, 22% { transform: rotate(-18deg); } 52%, 100% { transform: rotate(-36deg); } }
@keyframes gArrow { 0%, 30% { opacity: 0; transform: translateY(10px); } 52%, 86% { opacity: 1; transform: none; } 100% { opacity: 0; } }
/* press-brake: the same foot pressing the brake pedal down. */
.g-foot-press { transform-box: view-box; transform-origin: 84px 168px; animation: gFootPress 3.4s ease-in-out infinite; }
.g-pedal-press { transform-box: view-box; transform-origin: 210px 168px; animation: gPedalPress 3.4s ease-in-out infinite; }
.g-arrow-down { animation: gArrowDown 3.4s ease-in-out infinite; }
@keyframes gFootPress { 0%, 22% { transform: rotate(-13deg); } 52%, 100% { transform: rotate(0deg); } }
@keyframes gPedalPress { 0%, 22% { transform: rotate(-36deg); } 52%, 100% { transform: rotate(-18deg); } }
@keyframes gArrowDown { 0%, 30% { opacity: 0; transform: translateY(-10px); } 52%, 86% { opacity: 1; transform: none; } 100% { opacity: 0; } }
/* A shifter button to tap: it presses in and a ripple goes out. To hold:
   it stays in while a ring fills around it. */
.c-tap { transform-box: fill-box; transform-origin: center; animation: cTap 1.8s ease-in-out infinite; }
.c-ripple { transform-box: fill-box; transform-origin: center; animation: cRipple 1.8s ease-out infinite; }
@keyframes cTap { 0%, 10%, 32%, 100% { transform: scale(1); } 18% { transform: scale(0.78); } }
@keyframes cRipple { 0%, 16% { opacity: 0; transform: scale(1); } 20% { opacity: 1; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
.c-held { transform-box: fill-box; transform-origin: center; animation: cHeld 2.8s ease-in-out infinite; }
.c-hold { stroke-dasharray: 100.5; animation: cHold 2.8s linear infinite; }
@keyframes cHeld { 0%, 6% { transform: scale(1); } 10%, 62% { transform: scale(0.78); } 68%, 100% { transform: scale(1); } }
@keyframes cHold { 0%, 10% { stroke-dashoffset: 100.5; opacity: 1; } 60%, 84% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
/* A tip done: the tick draws itself. */
.d-tick { stroke-dasharray: 60; animation: dTick 0.6s 0.15s ease-out both; }
@keyframes dTick { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
/* The context-aware manual running: the level selector breathes and its dot blinks. */
.ctx-live { animation: ctxPulse 3s ease-in-out infinite; }
@keyframes ctxPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(77, 163, 255, 0); }
  50% { box-shadow: 0 0 26px 4px rgba(77, 163, 255, 0.35); }
}
.ctx-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: ctxDot 1.5s ease-in-out infinite; }
@keyframes ctxDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
/* Autopilot driving: its card breathes, so it is clear the car drives itself.
   Kept in step across redraws like the tip zones, from when it came on. */
.ap-live { animation: apPulse 2.2s ease-in-out infinite; }
@keyframes apPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(77, 163, 255, 0); background: #132238; }
  50% { box-shadow: 0 0 44px 10px rgba(77, 163, 255, 0.45), inset 0 0 30px rgba(77, 163, 255, 0.18); background: #183154; }
}
#offline { position: absolute; right: 48px; bottom: 12px; font: 600 14px 'Barlow', sans-serif; letter-spacing: 0.06em; color: #F5A524; display: none; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="top"></div><div id="tipslot"></div></div></div>
<div id="offline">NO DATA FROM CARLA</div>
<script>
'use strict';

// Values for everything the script does not send yet. The assists start OFF
// and the tip panel hidden, so nothing on screen claims a state the car is
// not in.
var DEFAULTS = {
  activeAssist: 'None',   // None | Cruise | Cruise standby | ACC | ACC standby | Autopilot
  level: null,            // Beginner | Experienced | Expert; null while the context-aware manual is off
  contextStatus: null,    // what the manual waits for, under an empty tip panel
  tipProgress: null,      // [tips given, tips for the level]
  speed: null,            // km/h; null until the first reading
  setSpeed: null,         // km/h; null when no speed is set
  throttleOverride: null, // true while the pedal overrides an assist; null works it out from the bars
  accGap: 2,              // 1..4
  accLead: null,          // m to the car ahead while ACC is on; null when there is none
  accWaiting: false,      // ACC stopped behind a car, waiting for RES or the throttle
  apTarget: 30,           // km/h
  apDistance: 17,         // m
  appliedThrottle: 0,     // %
  driverPedal: 0,         // %
  brake: 0,               // %
  gear: 'D',              // P | R | N | D
  driveMode: 'Normal',    // Eco | Normal | Sport
  regenLevel: 1,          // 0..3: Off | Low | Medium | Maximum
  showTip: false,
  tip: null,              // {title, body, why, highlight, control | gesture, action, complete}; null uses the level's sample tip
  accent: '#4DA3FF'
};

var SAMPLE_TIPS = {
  Beginner: {
    title: 'Cruise control holds your speed for you',
    body: 'Press SET to keep driving at your current speed. Tap the brake at any moment and cruise control switches off.',
    why: 'Why now: steady motorway speed for 20 seconds',
    key: 'SET',
    input: 'Shifter button [1]'
  },
  Experienced: {
    title: 'Change your set speed without braking',
    body: 'Use + and − to adjust the set speed in 5 km/h steps. After braking, RES brings back the speed you had set.',
    why: 'Why now: the speed limit changed to 100 km/h',
    key: '+ / −',
    input: 'D-pad up / down'
  },
  Expert: {
    title: 'A car is merging ahead',
    body: 'Adaptive cruise can react late when a car cuts in. Keep your foot ready over the brake. In dense traffic a shorter gap leaves less room to cut in.',
    why: 'Why now: merge lane ahead · adaptive cruise active',
    key: 'GAP',
    input: 'Shifter button [3]'
  }
};

var SPEED_MAX = 160;

function esc(v) {
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function pct(v) { return Math.max(0, Math.min(100, v)) + '%'; }

function chip(text) {
  return '<span style="padding: 4px 10px; border-radius: 6px; border: 1px solid #3A4250; font-size: 14px; font-weight: 600; color: #C9D0D8">' + text + '</span>';
}

var tipShownAt = 0;
var autopilotSince = 0;
var contextSince = 0;

// A zone the tip names gets the zone-on outline and a TIP tag. zoneAttr
// opens the element's style attribute, so the caller adds its own style.
function zoneOn(p, name) {
  return p.showTip && p.tip && (p.tip.highlight || []).indexOf(name) >= 0;
}
function zoneAttr(p, name) {
  return zoneOn(p, name) ? ' class="zone-on" style="animation-delay: -' + (Date.now() - tipShownAt) + 'ms; ' : ' style="';
}
function zoneTag(p, name) {
  return zoneOn(p, name) ? '<span class="zone-tag">TIP</span>' : '';
}

function render(p) {
  var accent = p.accent;
  var assist = p.activeAssist;
  var level = p.level;
  var speed = p.speed;
  var setSpeed = p.setSpeed === null ? '–' : p.setSpeed;
  var gap = Math.max(1, Math.min(4, p.accGap));
  var applied = p.appliedThrottle;
  var pedal = p.driverPedal;
  var brake = p.brake;
  var regen = Math.max(0, Math.min(3, p.regenLevel));
  // While a tip shows, its panel grows and everything above compacts.
  var compact = p.showTip;
  function z(full, small) { return compact ? small : full; }

  var active = { border: accent, bg: '#132238', chipText: 'ACTIVE', chipBg: accent, chipFg: '#0B0E13', value: '#E8EAED' };
  var standby = { border: '#6B5217', bg: '#1A1710', chipText: 'STANDBY', chipBg: '#3A2E14', chipFg: '#F5A524', value: '#E8EAED' };
  var off = { border: '#262D38', bg: '#141920', chipText: 'OFF', chipBg: '#262D38', chipFg: '#AEB6C0', value: '#7F8995' };

  var cc = assist === 'Cruise' ? active : (assist === 'Cruise standby' ? standby : off);
  var acc = assist === 'ACC' ? active : (assist === 'ACC standby' ? standby : off);
  // Plain and adaptive cruise share the set speed; only the one in use shows it.
  var ccSpeed = assist.indexOf('Cruise') === 0 ? setSpeed : '–';
  var accSpeed = assist.indexOf('ACC') === 0 ? setSpeed : '–';
  var lead = assist.indexOf('ACC') === 0 ? p.accLead : null;
  var ap = assist === 'Autopilot' ? Object.assign({}, active, { chipText: 'DRIVING' }) : off;

  var gapSeconds = ['1.0 s', '1.5 s', '2.0 s', '2.5 s'][gap - 1];
  var markerSpeed = assist === 'Autopilot' ? p.apTarget : setSpeed;
  var showMarker = assist !== 'None' && markerSpeed !== '–';
  var regenNames = ['Off', 'Low', 'Medium', 'Maximum'];

  var pedalStatus;
  if (assist === 'None' || assist === 'Cruise standby' || assist === 'ACC standby') {
    pedalStatus = { text: 'Manual control', bg: '#262D38', fg: '#C9D0D8' };
  } else if (p.throttleOverride === null ? pedal > applied : p.throttleOverride) {
    pedalStatus = { text: 'Driver override', bg: '#3A2E14', fg: '#F5A524' };
  } else {
    pedalStatus = { text: 'System controlled', bg: '#132238', fg: accent };
  }

  function card(s, inner, zone) {
    var attr = zoneAttr(p, zone);
    if (zone === 'autopilot' && assist === 'Autopilot' && !zoneOn(p, zone)) {
      attr = ' class="ap-live" style="animation-delay: -' + (Date.now() - autopilotSince) + 'ms; ';
    }
    return '<div' + attr + 'flex-grow: 1; box-sizing: border-box; padding: ' + z('18px 22px', '10px 18px') + '; border-radius: 16px; border: 2px solid ' + s.border + '; background: ' + s.bg + '; display: flex; flex-direction: column; justify-content: space-between">' + zoneTag(p, zone) + inner + '</div>';
  }
  function cardHead(title, s) {
    return '<div style="display: flex; align-items: center; justify-content: space-between">' +
      '<span style="font-size: 24px; font-weight: 600">' + title + '</span>' +
      '<span style="padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; background: ' + s.chipBg + '; color: ' + s.chipFg + '">' + s.chipText + '</span>' +
      '</div>';
  }

  var h = '';

  // Header
  h += '<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between">' +
    '<div style="display: flex; align-items: baseline; gap: 18px">' +
    '<span style="font-family: \'Barlow Semi Condensed\', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.08em">SMART MANUAL</span>' +
    '<span style="font-size: 19px; color: #9AA3AE">Context-aware driving guide</span>' +
    '</div>' +
    '<div style="display: flex; align-items: center; gap: 14px">' +
    (level
      ? '<span style="display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: ' + accent + '">' +
        '<span class="ctx-dot" style="animation-delay: -' + (Date.now() - contextSince) + 'ms"></span>CONTEXT AWARE · ON</span>'
      : '<span style="font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: #7F8995">CONTEXT AWARE · OFF</span>') +
    '<div' + (level ? ' class="ctx-live" style="animation-delay: -' + (Date.now() - contextSince) + 'ms; ' : ' style="') +
    'display: flex; gap: 6px; padding: 5px; border-radius: 12px; background: #141920; border: 1px solid ' + (level ? accent : '#262D38') + '">';
  // Each level with the key that starts it.
  [['Beginner', 'B'], ['Experienced', 'E'], ['Expert', 'P']].forEach(function (l) {
    var on = l[0] === level;
    var fg = on ? '#0B0E13' : (level ? '#9AA3AE' : '#6B7480');
    h += '<span style="display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 18px; border-radius: 8px; font-size: 17px; font-weight: 600; background: ' + (on ? accent : 'transparent') + '; color: ' + fg + '">' + l[0] +
      '<span style="padding: 0 6px; border-radius: 5px; border: 1px solid ' + fg + '; font-size: 13px; font-weight: 700; line-height: 18px; opacity: 0.75">' + l[1] + '</span></span>';
  });
  h += '</div>' +
    (level ? '<span style="font-size: 14px; color: #7F8995">Hold R to stop</span>' : '') +
    '</div></header>';

  h += '<main style="flex-grow: 1; min-height: 0; display: flex; gap: 24px">';

  // Speed assist column
  h += '<section aria-label="Speed assist" style="width: 560px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">' +
    '<h2 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: #9AA3AE">SPEED ASSIST · ONE ACTIVE AT A TIME</h2>';

  h += card(cc, cardHead('Cruise control', cc) +
    '<div style="display: flex; align-items: baseline; gap: 10px">' +
    '<span style="font-family: \'Barlow Semi Condensed\', sans-serif; font-size: ' + z(56, 38) + 'px; font-weight: 600; line-height: 1; color: ' + cc.value + '">' + esc(ccSpeed) + '</span>' +
    '<span style="font-size: 18px; color: #9AA3AE">km/h set speed</span></div>' +
    '<div style="display: flex; gap: 8px">' + chip('ON / OFF') + chip('+5 / −5') + chip('RES') +
    '<span style="font-size: 15px; color: #9AA3AE; margin-left: 6px">Brake cancels</span></div>', 'cruise');

  var bars = '';
  [4, 3, 2, 1].forEach(function (n) {
    var bg = n <= gap ? (assist === 'ACC' ? accent : '#7F8995') : '#262D38';
    bars += '<span style="display: block; height: 5px; border-radius: 3px; width: ' + (24 + (5 - n) * 14) + 'px; background: ' + bg + '"></span>';
  });
  // The car ahead, drawn above the gap bars when ACC has one.
  var leadCar = '<svg width="34" height="22" viewBox="0 0 40 26" fill="none" stroke="' + (lead !== null ? accent : 'transparent') + '" stroke-width="2.5" aria-hidden="true"><rect x="8" y="2" width="24" height="22" rx="6"></rect><line x1="12" y1="17" x2="28" y2="17"></line></svg>';
  var leadText = p.accWaiting && assist === 'ACC' ? 'Stopped · press RES to go'
    : (lead !== null ? 'Car ahead · ' + esc(lead) + ' m' : (assist.indexOf('ACC') === 0 ? 'No car ahead' : gapSeconds + ' time gap'));
  h += card(acc, cardHead('Adaptive cruise', acc) +
    '<div style="display: flex; align-items: center; gap: 28px">' +
    '<div style="display: flex; align-items: baseline; gap: 10px">' +
    '<span style="font-family: \'Barlow Semi Condensed\', sans-serif; font-size: ' + z(56, 38) + 'px; font-weight: 600; line-height: 1; color: ' + acc.value + '">' + esc(accSpeed) + '</span>' +
    '<span style="font-size: 18px; color: #9AA3AE">km/h</span></div>' +
    '<div style="display: flex; align-items: center; gap: 14px">' +
    (compact ? '' : '<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">' + leadCar + bars +
    '<svg width="40" height="26" viewBox="0 0 40 26" fill="none" stroke="#C9D0D8" stroke-width="2" aria-hidden="true"><rect x="8" y="2" width="24" height="22" rx="6"></rect><line x1="12" y1="10" x2="28" y2="10"></line></svg>' +
    '</div>') +
    '<div style="display: flex; flex-direction: column; gap: 2px">' +
    '<span style="font-size: 22px; font-weight: 600; color: ' + acc.value + '">Gap ' + gap + ' · ' + gapSeconds + '</span>' +
    '<span style="font-size: 16px; color: ' + (p.accWaiting && assist === 'ACC' ? '#F5A524' : '#9AA3AE') + '">' + leadText + '</span>' +
    '</div></div></div>' +
    '<div style="display: flex; gap: 8px; align-items: center">' + chip('HOLD ON / OFF') + chip('GAP − / +') + chip('+5 / −5') + chip('RES') + '</div>', 'acc');

  h += card(ap, cardHead('Autopilot', ap) +
    '<div style="display: flex; gap: 40px">' +
    '<div style="display: flex; flex-direction: column; gap: 2px">' +
    '<span style="font-size: 15px; font-weight: 600; letter-spacing: 0.06em; color: #9AA3AE">TARGET SPEED</span>' +
    '<span style="font-family: \'Barlow Semi Condensed\', sans-serif; font-size: ' + z(44, 32) + 'px; font-weight: 600; line-height: 1; color: ' + ap.value + '">' + esc(p.apTarget) + ' <span style="font-size: 18px; color: #9AA3AE">km/h</span></span>' +
    '</div>' +
    '<div style="display: flex; flex-direction: column; gap: 2px">' +
    '<span style="font-size: 15px; font-weight: 600; letter-spacing: 0.06em; color: #9AA3AE">FOLLOWING DISTANCE</span>' +
    '<span style="font-family: \'Barlow Semi Condensed\', sans-serif; font-size: ' + z(44, 32) + 'px; font-weight: 600; line-height: 1; color: ' + ap.value + '">' + esc(p.apDistance) + ' <span style="font-size: 18px; color: #9AA3AE">m</span></span>' +
    '</div></div>' +
    '<div style="display: flex; gap: 8px; align-items: center">' + chip('ON / OFF') + chip('+5 / −5') + chip('GAP − / +') +
    '<span style="font-size: 15px; color: #9AA3AE; margin-left: 6px">Brake or steer to take over</span></div>', 'autopilot');
  h += '</section>';

  // Speed and gear
  h += '<section aria-label="Speed and gear" style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: ' + z('32px 48px', '14px 40px') + '; border-radius: 20px; background: #10141A; border: 1px solid #1E242D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: ' + z(22, 10) + 'px">' +
    '<div' + zoneAttr(p, 'speed') + 'display: flex; flex-direction: column; align-items: center">' + zoneTag(p, 'speed') +
    '<span style="font-family: \'Barlow Semi Condensed\', sans-serif; font-size: ' + z(220, 120) + 'px; font-weight: 600; line-height: 0.88; font-variant-numeric: tabular-nums">' + (speed === null ? '–' : esc(speed)) + '</span>' +
    '<div style="display: flex; align-items: center; gap: 16px; margin-top: 8px">' +
    '<span style="font-size: 26px; color: #9AA3AE">km/h</span>' +
    (showMarker ? '<span style="padding: 4px 12px; border-radius: 8px; font-size: 18px; font-weight: 700; letter-spacing: 0.04em; background: #132238; color: ' + accent + '">SET ' + esc(markerSpeed) + '</span>' : '') +
    '</div></div>';

  h += '<div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 6px">' +

      src.connect(hum.filter);
      hum.filter.connect(hum.road);
      hum.road.connect(hum.out);
      src.start();
    }
    var t = audio.currentTime;
    var v = Math.max(0, Number(state.speed) || 0);
    var load = Math.max(Number(state.appliedThrottle) || 0, (Number(state.brake) || 0) * 0.5) / 100;
    var moving = Math.min(1, v / 5);
    var base = 55 + v * 4;  // 55 Hz creeping, about 455 Hz at 100 km/h
    hum.oscs.forEach(function (o) { o.osc.frequency.setTargetAtTime(base * o.ratio, t, 0.08); });
    hum.whine.gain.setTargetAtTime(moving * (0.025 + 0.06 * load), t, 0.1);
    hum.road.gain.setTargetAtTime(Math.min(0.12, v / 900), t, 0.2);
    hum.filter.frequency.setTargetAtTime(250 + v * 12, t, 0.2);
    hum.out.gain.setTargetAtTime(state.speed === null ? 0 : 1, t, 0.3);
  } catch (e) { /* no audio */ }
}

// The chime for a change of assist: ACC or autopilot coming on or going off
// (to standby or off); plain cruise has none.
var lastAssist = null;
function assistChime(assist) {
  if (lastAssist !== null && assist !== lastAssist) {
    if (lastAssist === 'Autopilot') chime('autopilotOff');
    else if (lastAssist === 'ACC') chime('accOff');
    if (assist === 'Autopilot') chime('autopilotOn');
    else if (assist === 'ACC') chime('accOn');
  }
  lastAssist = assist;
}

var stage = document.getElementById('stage');
var frame = document.getElementById('frame');
var topEl = document.getElementById('top');
var tipSlot = document.getElementById('tipslot');
var offline = document.getElementById('offline');
var state = Object.assign({}, DEFAULTS);
var shown = '';
var shownTip = null;

function draw() {
  assistChime(state.activeAssist);
  updateHum();
  if (state.activeAssist === 'Autopilot' && !autopilotSince) autopilotSince = Date.now();
  if (state.activeAssist !== 'Autopilot') autopilotSince = 0;
  if (state.level && !contextSince) contextSince = Date.now();
  if (!state.level) contextSince = 0;
  frame.style.setProperty('--accent', state.accent);
  var tipKey = state.showTip ? JSON.stringify([state.tip, state.level])
    : 'idle' + JSON.stringify([state.level, state.contextStatus, state.tipProgress]);
  if (tipKey !== shownTip) {
    if (state.showTip) {
      tipShownAt = Date.now();
      chime(state.tip && state.tip.complete ? 'tipDone' : 'tip');
    }
    tipSlot.innerHTML = renderTip(state);
    shownTip = tipKey;
  }
  var html = render(state);
  if (html !== shown) {
    topEl.innerHTML = html;
    shown = html;
  }
}

function fit() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
}

window.addEventListener('resize', fit);
fit();
draw();

var events = new EventSource('events');
events.onmessage = function (e) {
  Object.assign(state, JSON.parse(e.data));
  offline.style.display = 'none';
  draw();
};
events.onerror = function () { offline.style.display = 'block'; };
// Sent when the driver script exits.
events.addEventListener('close', function () {
  events.close();
  window.close();
});
</script>
</body>
